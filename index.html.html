<script type="text/babel">
const { useState, useEffect } = React;

const CHAVE = "conecta-escola-v2";
const fmt = (iso) => (iso ? iso.split("-").reverse().join("/") : "—");

/* Data atual no fuso local (evita erro de 1 dia do toISOString/UTC). */
const hoje = (() => {
  const d = new Date();
  const y = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2, "0");
  const day = String(d.getDate()).padStart(2, "0");
  return `${y}-${m}-${day}`;
})();

const MESES = ["JAN","FEV","MAR","ABR","MAI","JUN","JUL","AGO","SET","OUT","NOV","DEZ"];
const MESES_LONGO = ["janeiro","fevereiro","março","abril","maio","junho","julho","agosto","setembro","outubro","novembro","dezembro"];

const iniciais = (nome) =>
  nome.split(" ").filter(Boolean).slice(0, 2).map((p) => p[0].toUpperCase()).join("");

/* Cor de avatar baseada no hash do nome (sempre a mesma para o mesmo nome) */
const CORES_AVATAR = [
  "bg-blue-700",
  "bg-emerald-600",
  "bg-amber-600",
  "bg-teal-600",
  "bg-orange-600",
  "bg-red-600",
  "bg-sky-700",
];
const corAvatar = (nome) => {
  let h = 0;
  for (let i = 0; i < nome.length; i++) h = (h * 31 + nome.charCodeAt(i)) >>> 0;
  return CORES_AVATAR[h % CORES_AVATAR.length];
};

/* Cor associada à disciplina (para etiquetas e faixas laterais) */
const COR_DISCIPLINA = {
  "Matemática": { pill: "azul",     cor: "bg-blue-700",    hex: "#1d4ed8" },
  "Português":  { pill: "vermelho", cor: "bg-red-600",     hex: "#dc2626" },
  "Ciências":   { pill: "verde",    cor: "bg-emerald-600", hex: "#059669" },
};
const corDisc = (d) => COR_DISCIPLINA[d] || { pill: "cinza", cor: "bg-slate-500", hex: "#64748b" };

/* ---------- componentes visuais ---------- */

function Card({ children, className = "", onClick }) {
  return (
    <div
      onClick={onClick}
      className={"bg-white border border-slate-200 rounded-lg shadow-sm " + className}>
      {children}
    </div>
  );
}

function Pill({ cor, children, icon }) {
  const mapa = {
    azul:     "bg-blue-50 text-blue-700 border-blue-200",
    verde:    "bg-emerald-50 text-emerald-700 border-emerald-200",
    amarelo:  "bg-amber-50 text-amber-800 border-amber-200",
    vermelho: "bg-red-50 text-red-700 border-red-200",
    cinza:    "bg-slate-100 text-slate-600 border-slate-200",
    ciano:    "bg-cyan-50 text-cyan-700 border-cyan-200",
  };
  return (
    <span className={"inline-flex items-center gap-1 text-xs font-medium px-2 py-0.5 rounded-md border " + mapa[cor]}>
      {icon && <Icon name={icon} className="w-3.5 h-3.5" />}
      {children}
    </span>
  );
}

/* Avatar com iniciais sobre cor sólida */
function Avatar({ nome, size = "w-9 h-9", textSize = "text-xs" }) {
  return (
    <div className={"rounded-full " + corAvatar(nome) + " text-white flex items-center justify-center font-semibold shrink-0 " + size}>
      <span className={textSize}>{iniciais(nome)}</span>
    </div>
  );
}

const corDaNota = (n) => (n >= 7 ? "verde" : n >= 5 ? "amarelo" : "vermelho");
const barraDaNota = (n) => (n >= 7 ? "bg-green-600" : n >= 5 ? "bg-amber-500" : "bg-red-500");

const campo =

/* ---------- LOGIN (RF01) ---------- */

function Login({ entrar }) {
  const [email, setEmail] = useState("");
  const [senha, setSenha] = useState("");
  const [erro, setErro] = useState("");

  function submeter(e) {
    e.preventDefault();
    if (!email.trim() || !senha) { setErro("Preencha e-mail e senha."); return; }
    entrar(email, senha, setErro);
  }

  const demos = [
    { tipo: "Aluno",       email: "renato@escola.com", cor: "bg-blue-100 text-blue-700",       icon: "cap" },
    { tipo: "Responsável", email: "marta@email.com",   cor: "bg-emerald-100 text-emerald-700", icon: "perfil" },
    { tipo: "Professor",   email: "carlos@escola.com", cor: "bg-amber-100 text-amber-700",     icon: "book" },
  ];

  return (
    <div className="min-h-screen bg-slate-100 flex items-center justify-center p-4">
      <div className="w-full max-w-sm animate__animated animate__fadeIn">
        {/* Logotipo + nome */}
        <div className="flex flex-col items-center text-center mb-6">
          <div className="w-14 h-14 rounded-lg bg-marca-600 text-white flex items-center justify-center">
            <Icon name="cap" className="w-8 h-8" />
          </div>
          <h1 className="text-2xl font-bold tracking-tight mt-4">
            <span className="text-marca-600">Conecta</span><span className="text-slate-900">Escola</span>
          </h1>
          <p className="text-sm text-slate-600 mt-1">Plataforma escolar integrada</p>
        </div>

        {/* Formulário */}
        <form onSubmit={submeter} className="bg-white border border-slate-200 rounded-lg shadow-sm p-6 space-y-4">
          <div>
            <h2 className="text-base font-semibold text-slate-900">Acessar a plataforma</h2>
            <p className="text-xs text-slate-500 mt-0.5">Use suas credenciais institucionais.</p>
          </div>

          <div className="space-y-1">
            <label className="block text-sm font-medium text-slate-700">E-mail</label>
            <div className="relative">
              <input type="email" value={email} onChange={(e) => { setEmail(e.target.value); setErro(""); }}
                placeholder="seu@escola.com"
                className={campo} />
            </div>
          </div>

          <div className="space-y-1">
            <label className="block text-sm font-medium text-slate-700">Senha</label>
            <input type="password" value={senha} onChange={(e) => { setSenha(e.target.value); setErro(""); }}
              placeholder="••••••"
              className={campo} />
          </div>

          {erro && (
            <p className="text-sm text-red-700 bg-red-50 border border-red-200 rounded-md px-3 py-2">{erro}</p>
          )}

          <button type="submit"
            className="w-full bg-marca-600 hover:bg-marca-700 active:bg-marca-700 text-white font-semibold rounded-md py-2.5 text-sm transition">
            Entrar na plataforma
          </button>

          <div className="pt-4 border-t border-slate-200">
            <p className="text-xs text-slate-600 mb-2">
              <span className="font-semibold text-slate-900">Contas de demonstração</span> · senha&nbsp;<span className="font-mono bg-slate-100 border border-slate-200 px-1 rounded">123</span>
            </p>
            <div className="grid gap-2">
              {demos.map((d) => (
                <button key={d.email} type="button"
                  onClick={() => { setEmail(d.email); setSenha("123"); setErro(""); }}
                  className="flex items-center gap-3 bg-white hover:bg-slate-50 border border-slate-200 hover:border-slate-300 rounded-md px-3 py-2 transition text-left">
                  <span className={"w-8 h-8 rounded-md flex items-center justify-center shrink-0 " + d.cor}>
                    <Icon name={d.icon} className="w-4 h-4" />
                  </span>
                  <span className="flex-1 min-w-0">
                    <span className="block text-sm font-medium text-slate-900">{d.tipo}</span>
                    <span className="block text-xs text-slate-500 truncate">{d.email}</span>
                  </span>
                  <Icon name="arrow" className="w-4 h-4 text-slate-400" />
                </button>
              ))}
            </div>
          </div>
        </form>

        <p className="text-center text-xs text-slate-500 mt-6">
          © 2026 ConectaEscola · Conectando escola, pais e alunos
        </p>
      </div>
    </div>
  );
}

  const primeiraLetra = user.nome.split(" ")[0];
  const hora = new Date().getHours();
  const saudacao = hora < 12 ? "Bom dia" : hora < 18 ? "Boa tarde" : "Boa noite";

  const stats = [
    { rotulo: "Comunicados", valor: dados.comunicados },
    { rotulo: "Tarefas",     valor: dados.tarefas },
    { rotulo: "Eventos",     valor: dados.eventos },
  ];

  return (
    <div className="rounded-lg bg-marca-700 text-white overflow-hidden mb-4">
      <div className="p-4">
        <div className="min-w-0">
          <p className="text-sm text-marca-100">{saudacao},</p>
          <h2 className="text-xl font-semibold leading-tight truncate">{primeiraLetra}</h2>
          <p className="text-xs text-marca-100 mt-0.5">
            {user.tipo === "professor"
              ? "Disciplina: " + user.disciplina
              : user.tipo === "aluno"
                ? "Turma " + user.turma + " · 3º bimestre"
                : "Acompanhe seus filhos"}
          </p>
        </div>

        <div className="grid grid-cols-3 mt-4 pt-3 border-t border-white/20">
          {stats.map((s) => (
            <div key={s.rotulo} className="text-center">
              <p className="text-2xl font-semibold leading-none">{s.valor.length}</p>
              <p className="text-xs text-marca-100 mt-1">{s.rotulo}</p>
            </div>
          ))}
        </div>
      </div>
    </div>
  );
}

/* ---------- TAREFAS (RF04–RF07) ---------- */

function ListaTarefas({ user, tarefas, abrir }) {
  if (tarefas.length === 0) {
    return (
      <Card className="p-8 text-center text-sm text-slate-500">
        <div className="w-12 h-12 mx-auto rounded-full bg-slate-100 flex items-center justify-center mb-3">
          <Icon name="tarefas" className="w-6 h-6 text-slate-400" />
        </div>
        Nenhuma tarefa atribuída no momento.
      </Card>
    );
  }

  const pendentes = tarefas.filter((t) => {
    const entrega = user.tipo === "aluno" && (t.entregas || []).find((e) => e.alunoId === user.id);
    return !entrega || entrega.status !== "entregue";
  }).length;

  return (
    <div className="space-y-3">
      {/* Mini-header com resumo */}
      <div className="flex items-center justify-between px-1">
        <p className="text-sm font-medium text-slate-600">
          {tarefas.length} {tarefas.length === 1 ? "tarefa" : "tarefas"}
        </p>
        {pendentes > 0 && (
          <Pill cor="amarelo" icon="clock">{pendentes} pendente{pendentes > 1 ? "s" : ""}</Pill>
        )}
      </div>

      <div className="space-y-3">
        {tarefas.map((t) => {
          const entrega = user.tipo === "aluno" && (t.entregas || []).find((e) => e.alunoId === user.id);
          const entregue = entrega && entrega.status === "entregue";
          const atrasada = !entregue && t.prazo < hoje;
          const cd = corDisc(t.disciplina);
          return (
            <button key={t.id} onClick={() => abrir(t)} className="block w-full text-left">
              <Card className="p-4 pl-5 relative overflow-hidden ce-card-hover">
                <div className={"absolute left-0 top-0 bottom-0 w-1 " + cd.cor}></div>
                <div>
                  <div className="flex items-center gap-1.5 flex-wrap">
                    <Pill cor={cd.pill}>{t.disciplina}</Pill>
                    {entregue && <Pill cor="verde" icon="check">Entregue</Pill>}
                    {atrasada && <Pill cor="vermelho">Atrasada</Pill>}
                    {!entregue && !atrasada && user.tipo === "aluno" && <Pill cor="amarelo" icon="clock">Pendente</Pill>}
                  </div>
                  <h3 className="font-semibold text-slate-900 mt-2 leading-snug">{t.titulo}</h3>
                  <p className="text-sm text-slate-500 mt-1 line-clamp-1">{t.descricao}</p>
                  <p className={"text-xs mt-2 inline-flex items-center gap-1 font-medium " + (atrasada ? "text-red-700" : "text-slate-500")}>
                    <Icon name="calendar" className="w-3.5 h-3.5" />
                    Prazo: {fmt(t.prazo)}
                  </p>
                </div>
              </Card>
            </button>
          );
        })}
      </div>
    </div>
  );
}

    <div className="space-y-4 animate__animated animate__fadeIn animate__faster">

        <div className="p-5">

            <div className="flex justify-between items-center">
              <dt className="text-slate-500">Prazo</dt>
              <dd className="text-slate-900 font-semibold">{fmt(tarefa.prazo)}</dd>
            </div>
            <div className="flex justify-between items-center pt-3 border-t border-slate-100">
              <dt className="text-slate-500">Professor</dt>
              <dd className="text-slate-900 font-semibold flex items-center gap-2">
                {professor && <Avatar nome={professor.nome} size="w-5 h-5" textSize="text-[9px]" />}
                {professor ? professor.nome : "—"}
              </dd>
            </div>
          </dl>
        </div>

      {user.tipo === "aluno" && (

              <Icon name="check" className="w-5 h-5" />
            </div>
            <div>
              <p className="text-sm font-semibold text-green-800">Tarefa entregue</p>
              <p className="text-xs text-green-700">Você já enviou esta atividade. Aguarde a avaliação.</p>

          <button onClick={() => entregar(tarefa.id)}

            <Icon name="check" className="w-4 h-4" />
            Marcar como entregue
          </button>
        )
      )}

      {user.tipo === "professor" && (
        <Card className="p-5">
          <div className="flex items-baseline justify-between mb-3">
            <h3 className="font-semibold text-slate-900">Entregas</h3>
            <span className="text-sm text-slate-600">
              {entregues} de {total}

          </div>

            <div className="h-2 bg-slate-200 rounded-full overflow-hidden">
              <div className="ce-progress-fill h-full" style={{ width: pct + "%" }}></div>

          </div>

              return (

                    {al && <Avatar nome={al.nome} size="w-6 h-6" textSize="text-[10px]" />}
                    {al ? al.nome : "—"}
                  </span>
                  <Pill cor={e.status === "entregue" ? "verde" : "amarelo"} icon={e.status === "entregue" ? "check" : "clock"}>
                    {e.status === "entregue" ? "Entregue" : "Pendente"}
                  </Pill>
                </li>
              );
            })}
            {(tarefa.entregas || []).length === 0 && (
              <li className="text-sm text-slate-400 py-2 text-center">Nenhuma entrega registrada.</li>
            )}
          </ul>
        </Card>
      )}
    </div>
  );
}

/* ---------- NOTAS & FREQUÊNCIA (RF08, RF09) ---------- */

function Notas({ alunos, aluno, setAluno, db }) {
  if (!aluno) return (
    <Card className="p-8 text-center text-sm text-slate-500">
      <div className="w-12 h-12 mx-auto rounded-full bg-slate-100 flex items-center justify-center mb-3">
        <Icon name="notas" className="w-6 h-6 text-slate-400" />
      </div>
      Nenhum aluno vinculado.
    </Card>
  );

  const notas = db.notas.filter((n) => n.alunoId === aluno.id);
  const faltas = notas.reduce((s, n) => s + n.faltas, 0);
  const media = notas.length ? (notas.reduce((s, n) => s + n.nota, 0) / notas.length) : 0;
  const aprovadas = notas.filter((n) => n.nota >= 7).length;

  return (
    <div className="space-y-3">
      {alunos.length > 1 && (
        <div className="space-y-1">
          <label className="block text-sm font-medium text-slate-700">Aluno</label>
          <select value={aluno.id} onChange={(e) => setAluno(e.target.value)} className={campo}>
            {alunos.map((a) => <option key={a.id} value={a.id}>{a.nome}</option>)}
          </select>
        </div>
      )}

      {/* Card de destaque: média geral */}
      <div className="rounded-lg bg-marca-700 text-white p-4">
        <p className="text-sm text-marca-100">Média geral</p>
        <p className="text-3xl font-semibold leading-tight mt-0.5">{media.toFixed(1).replace(".", ",")}</p>
        <p className="text-xs text-marca-100 mt-0.5">3º bimestre · Turma {aluno.turma}</p>
        <div className="grid grid-cols-2 gap-3 mt-4 pt-3 border-t border-white/20">
          <div>
            <p className="text-xl font-semibold leading-none">{faltas}</p>
            <p className="text-xs text-marca-100 mt-1">Faltas no bimestre</p>
          </div>
          <div>
            <p className="text-xl font-semibold leading-none">{aprovadas}/{notas.length}</p>
            <p className="text-xs text-marca-100 mt-1">Notas acima de 7,0</p>
          </div>
        </div>
      </div>

      {/* Nome do aluno */}
      <Card className="p-4 flex items-center gap-3">
        <Avatar nome={aluno.nome} size="w-10 h-10" textSize="text-sm" />
        <div className="min-w-0">
          <h3 className="font-semibold text-slate-900 truncate">{aluno.nome}</h3>
          <p className="text-xs text-slate-500">{aluno.email}</p>
        </div>
      </Card>

      {notas.length === 0 && (
        <Card className="p-6 text-center text-sm text-slate-500">Sem notas lançadas neste bimestre.</Card>
      )}

      {notas.map((n) => {
        const cd = corDisc(n.disciplina);
        const pctNota = Math.min(100, Math.round((n.nota / 10) * 100));
        return (
          <Card key={n.id} className="p-4">
            <div className="flex items-center justify-between mb-3">
              <div className="min-w-0">
                <h4 className="font-medium text-slate-900 truncate">
                  <span className={"inline-block w-2 h-2 rounded-sm mr-1.5 align-middle " + cd.cor}></span>
                  {n.disciplina}
                </h4>
                <p className="text-xs text-slate-500">{n.faltas} falta{n.faltas !== 1 ? "s" : ""}</p>
              </div>
              <div className="text-right shrink-0">
                <p className={"text-xl font-semibold leading-none " + textoDaNota(n.nota)}>
                  {n.nota.toFixed(1).replace(".", ",")}
                </p>
                <p className="text-xs text-slate-500 mt-0.5">de 10,0</p>
              </div>
            </div>
            {/* barra de progresso da nota */}
            <div className="flex items-center gap-2">
              <div className="flex-1 h-2 bg-slate-200 rounded-full overflow-hidden">
                <div className={"h-full rounded-full " + barraDaNota(n.nota)} style={{ width: pctNota + "%" }}></div>
              </div>
              <span className="text-xs font-medium text-slate-600">{pctNota}%</span>
            </div>
          </Card>
        );
      })}
    </div>
  );
}

/* ---------- AGENDA (RF10) ---------- */

function Agenda({ eventos }) {
  if (eventos.length === 0) {
    return (
      <Card className="p-8 text-center text-sm text-slate-500">
        <div className="w-12 h-12 mx-auto rounded-full bg-slate-100 flex items-center justify-center mb-3">
          <Icon name="calendar" className="w-6 h-6 text-slate-400" />
        </div>
        Nenhum evento agendado.
      </Card>
    );
  }

  const proximo = eventos.find((e) => e.data >= hoje) || eventos[0];

  const corPorTipo = (titulo) => {
    const t = titulo.toLowerCase();
    if (t.includes("simulado") || t.includes("prova")) return { cor: "bg-blue-700", pill: "azul" };
    if (t.includes("reunião")) return { cor: "bg-cyan-600", pill: "ciano" };
    if (t.includes("feira")) return { cor: "bg-emerald-600", pill: "verde" };
    if (t.includes("entrega") || t.includes("cartaz")) return { cor: "bg-amber-500", pill: "amarelo" };
    return { cor: "bg-slate-500", pill: "cinza" };
  };

  return (
    <div className="space-y-3">
      {/* Próximo evento */}
      <div className="relative overflow-hidden rounded-lg bg-white border border-slate-200 shadow-sm">
        <div className="absolute left-0 top-0 bottom-0 w-1 bg-emerald-600"></div>
        <div className="p-4 pl-5">
          <div className="flex items-center gap-1.5 text-xs font-semibold text-emerald-700">
            <Icon name="clock" className="w-3.5 h-3.5" />
            Próximo evento
          </div>
          <h3 className="text-base font-semibold mt-1.5 leading-tight text-slate-900">{proximo.titulo}</h3>
          <div className="flex items-center gap-4 mt-2 text-sm text-slate-600">
            <span className="inline-flex items-center gap-1"><Icon name="calendar" className="w-3.5 h-3.5 text-slate-400" />{fmt(proximo.data)}</span>
            <span className="inline-flex items-center gap-1"><Icon name="location" className="w-3.5 h-3.5 text-slate-400" />{proximo.local}</span>
          </div>
        </div>
      </div>

      <p className="text-sm font-medium text-slate-600 px-1">
        Agenda completa
      </p>

      <div className="space-y-3">
        {eventos.map((e) => {
          const partes = e.data.split("-");
          const dia = partes[2], mes = partes[1];
          const cor = corPorTipo(e.titulo);
          const destaque = e.id === proximo.id;
          return (
            <Card key={e.id} className={"p-4 " + (destaque ? "ring-1 ring-emerald-300" : "")}>
              <div className="flex items-center gap-3.5">
                {/* Bloco de data */}
                <div className={"w-14 h-14 rounded-lg flex flex-col items-center justify-center shrink-0 " + cor.cor + " text-white"}>
                  <div className="text-xl font-semibold leading-none">{dia}</div>
                  <div className="text-[10px] font-medium mt-1">{MESES[Number(mes) - 1]}</div>
                </div>
                <div className="min-w-0 flex-1">
                  <h3 className="font-semibold text-slate-900 truncate leading-tight">{e.titulo}</h3>
                  <p className="text-xs text-slate-500 mt-0.5 inline-flex items-center gap-1">
                    <Icon name="location" className="w-3 h-3" />
                    {e.local}
                  </p>
                  <div className="mt-1.5 flex items-center gap-1.5 flex-wrap">
                    <Pill cor={cor.pill}>{e.turma === "todas" ? "Toda a escola" : "Turma " + e.turma}</Pill>
                    {destaque && <Pill cor="verde">Próximo</Pill>}
                  </div>
                </div>
              </div>
            </Card>
          );
        })}
      </div>
    </div>
  );
}

            <input type="date" value={prazo} onChange={(e) => setPrazo(e.target.value)} className={campo} />
          </div>
        )}
        <button onClick={() => publicar({ tipo, titulo: titulo.trim(), texto: texto.trim(), turma, prazo })}
          disabled={!podePublicar}
          className="w-full bg-marca-600 hover:bg-marca-700 active:bg-marca-700 text-white font-semibold rounded-md py-2.5 text-sm disabled:opacity-50 disabled:cursor-not-allowed disabled:hover:bg-marca-600 transition inline-flex items-center justify-center gap-2">
          <Icon name="send" className="w-4 h-4" />
          Publicar {tipo === "comunicado" ? "comunicado" : "tarefa"}
        </button>
      </Card>
    </div>
  );
}

/* ---------- PERFIL ---------- */

function Perfil({ user, sair, resetar, db }) {
  const rotulo = user.tipo === "professor" ? ("Professor · " + user.disciplina)
    : user.tipo === "aluno" ? ("Aluno · Turma " + user.turma) : "Responsável";

  // estatísticas do perfil
  let stats = [];
  if (user.tipo === "aluno") {
    const notas = db.notas.filter((n) => n.alunoId === user.id);
    const media = notas.length ? (notas.reduce((s, n) => s + n.nota, 0) / notas.length) : 0;
    const faltas = notas.reduce((s, n) => s + n.faltas, 0);
    stats = [
      { rotulo: "Média geral", valor: media ? media.toFixed(1).replace(".", ",") : "—" },
      { rotulo: "Faltas", valor: faltas },
      { rotulo: "Disciplinas", valor: notas.length },
    ];
  } else if (user.tipo === "professor") {
    const tarefas = db.tarefas.filter((t) => t.professorId === user.id);
    const comunicados = db.comunicados.filter((c) => c.autorId === user.id);
    stats = [
      { rotulo: "Tarefas criadas", valor: tarefas.length },
      { rotulo: "Comunicados", valor: comunicados.length },
      { rotulo: "Eventos", valor: db.eventos.length },
    ];
  } else {
    const filhos = db.usuarios.filter((u) => (user.filhos || []).includes(u.id));
    stats = [
      { rotulo: "Filhos", valor: filhos.length },
      { rotulo: "Comunicados", valor: db.comunicados.length },
      { rotulo: "Eventos", valor: db.eventos.length },
    ];
  }

  return (
    <div className="space-y-4">
      {/* Dados do usuário */}
      <Card className="p-5 flex items-center gap-4">
        <Avatar nome={user.nome} size="w-16 h-16" textSize="text-xl" />
        <div className="min-w-0">
          <h2 className="text-lg font-semibold text-slate-900 truncate">{user.nome}</h2>
          <div className="text-sm text-slate-600 mt-0.5">{rotulo}</div>
          <p className="text-xs text-slate-500 mt-0.5 truncate">{user.email}</p>
        </div>
      </Card>

      {/* Estatísticas */}
      <Card className="grid grid-cols-3 divide-x divide-slate-200">
        {stats.map((s) => (
          <div key={s.rotulo} className="px-1 py-4 text-center">
            <p className="text-xl font-semibold text-slate-900 leading-none">{s.valor}</p>
            <p className="text-xs text-slate-500 mt-1.5">{s.rotulo}</p>
          </div>
        ))}
      </Card>

      {/* Ações */}
      <div className="space-y-2">
        <button onClick={sair}
          className="w-full flex items-center justify-center gap-2 bg-white text-red-700 border border-red-200 hover:bg-red-50 hover:border-red-300 font-medium rounded-lg py-2.5 text-sm transition">
          <Icon name="logout" className="w-4 h-4" />
          Sair da conta
        </button>
        <button onClick={resetar}
          className="w-full flex items-center justify-center gap-2 bg-white text-slate-700 border border-slate-300 hover:bg-slate-50 font-medium rounded-lg py-2.5 text-sm transition">
          <Icon name="reset" className="w-4 h-4" />
          Restaurar dados de exemplo
        </button>
      </div>

      <p className="text-center text-xs text-slate-500">
        ConectaEscola v2 · Sessão ativa
      </p>
    </div>
  );
}

/* ---------- APP ---------- */

function App() {
  const [db, setDb] = useState(() => {
    try {
      const salvo = localStorage.getItem(CHAVE);
      if (!salvo) return DADOS_INICIAIS;
      const parsed = JSON.parse(salvo);
      return parsed && Array.isArray(parsed.usuarios) ? parsed : DADOS_INICIAIS;
    } catch {
      return DADOS_INICIAIS;
    }
  });
  const [user, setUser] = useState(null);
  const [view, setView] = useState("inicio");
  const [tarefaAberta, setTarefaAberta] = useState(null);
  const [alunoSelecionado, setAlunoSelecionado] = useState(null);

  /* RF11 — persistência no navegador */
  useEffect(() => {
    try {
      localStorage.setItem(CHAVE, JSON.stringify(db));
    } catch {
      // Ignora erro caso o storage esteja bloqueado
    }
  }, [db]);

  function entrar(email, senha, onError) {
    const u = db.usuarios.find(
      (x) => x.email.toLowerCase() === email.trim().toLowerCase() && x.senha === senha
    );
    if (u) { setUser(u); setView("inicio"); setTarefaAberta(null); }
    else if (onError) onError("E-mail ou senha incorretos.");
    else alert("E-mail ou senha incorretos!");
  }

  function sair() { setUser(null); setTarefaAberta(null); setAlunoSelecionado(null); }

  function resetar() {
    if (confirm("Restaurar os dados de exemplo? As alterações feitas serão perdidas.")) {
      try { localStorage.removeItem(CHAVE); } catch {}
      setDb(DADOS_INICIAIS);
      setView("inicio");
      setTarefaAberta(null);
    }
  }

  if (!user) return <Login entrar={entrar} />;

  /* listas derivadas do perfil */
  const turmasUser = user.tipo === "responsavel"
    ? db.usuarios.filter((u) => (user.filhos || []).includes(u.id)).map((u) => u.turma)
    : [user.turma];

  const comunicados = (user.tipo === "professor"
    ? [...db.comunicados]
    : db.comunicados.filter((c) => c.turma === "todas" || turmasUser.includes(c.turma))
  ).sort((a, b) => ((b.fixado ? 1 : 0) - (a.fixado ? 1 : 0)) || b.data.localeCompare(a.data));

  const tarefas = (user.tipo === "professor"
    ? db.tarefas.filter((t) => t.professorId === user.id)
    : db.tarefas.filter((t) => t.turma === "todas" || turmasUser.includes(t.turma))
  ).sort((a, b) => a.prazo.localeCompare(b.prazo));

  const eventos = (user.tipo === "professor"
    ? [...db.eventos]
    : db.eventos.filter((e) => e.turma === "todas" || turmasUser.includes(e.turma))
  ).sort((a, b) => a.data.localeCompare(b.data));

  const alunosVisiveis = user.tipo === "aluno" ? [user]
    : user.tipo === "responsavel"
      ? db.usuarios.filter((u) => u.tipo === "aluno" && (user.filhos || []).includes(u.id))
      : db.usuarios.filter((u) => u.tipo === "aluno");
  const alunoNotas = alunosVisiveis.find((a) => a.id === alunoSelecionado) || alunosVisiveis[0];
  const tarefaAtual = tarefaAberta
    ? (db.tarefas.find((t) => t.id === tarefaAberta.id) || tarefaAberta)
    : null;

  function entregar(tarefaId) {
    setDb((atual) => ({
      ...atual,
      tarefas: atual.tarefas.map((t) => {
        if (t.id !== tarefaId) return t;
        const entregas = (t.entregas || []).slice();
        const i = entregas.findIndex((e) => e.alunoId === user.id);
        if (i >= 0) entregas[i] = { ...entregas[i], status: "entregue" };
        else entregas.push({ alunoId: user.id, status: "entregue" });
        return { ...t, entregas };
      }),
    }));
  }

  function publicar(item) {
    const id = "x" + Date.now();
    if (item.tipo === "comunicado") {
      setDb((atual) => ({
        ...atual,
        comunicados: [{
          id: id, titulo: item.titulo, texto: item.texto, autorId: user.id,
          turma: item.turma, data: hoje, fixado: false
        }].concat(atual.comunicados),
      }));
    } else {
      setDb((atual) => ({
        ...atual,
        tarefas: [{
          id: id, titulo: item.titulo, disciplina: user.disciplina, professorId: user.id,
          turma: item.turma, prazo: item.prazo, descricao: item.texto,
          entregas: atual.usuarios
            .filter((u) => u.tipo === "aluno" && (item.turma === "todas" || u.turma === item.turma))
            .map((u) => ({ alunoId: u.id, status: "pendente" })),
        }].concat(atual.tarefas),
      }));
    }
    setView(item.tipo === "comunicado" ? "inicio" : "tarefas");
  }

  const titulos = {
    inicio: "Início", tarefas: "Tarefas", agenda: "Agenda",
    notas: "Notas & Frequência", publicar: "Publicar", perfil: "Perfil",
  };
  const subtituloPerfil = user.tipo === "professor" ? ("Professor · " + user.disciplina)
    : user.tipo === "responsavel" ? "Responsável"
    : ("Aluno · Turma " + user.turma);

  const abas = user.tipo === "professor"
    ? [["inicio", "home"], ["tarefas", "tarefas"], ["agenda", "agenda"], ["publicar", "publicar"], ["perfil", "perfil"]]
    : [["inicio", "home"], ["tarefas", "tarefas"], ["agenda", "agenda"], ["notas", "notas"], ["perfil", "perfil"]];

  return (
    <div className="min-h-screen flex justify-center bg-slate-200">
      <div className="w-full max-w-md bg-slate-50 min-h-screen flex flex-col md:border-x md:border-slate-200 relative">
        {/* Faixa da cor institucional no topo */}
        <div className="h-1 bg-marca-600"></div>

        <header className="sticky top-0 z-10 bg-white border-b border-slate-200 px-4 py-3">
          <div className="flex items-center justify-between gap-3">
            <div className="flex items-center gap-2.5 min-w-0">
              <div className="w-9 h-9 rounded-lg bg-marca-600 text-white flex items-center justify-center shrink-0">
                <Icon name="cap" className="w-5 h-5" />
              </div>
              <div className="min-w-0">
                <h1 className="text-base font-semibold text-slate-900 leading-tight truncate">{titulos[view]}</h1>
                <p className="text-xs text-slate-500 leading-tight truncate">{subtituloPerfil}</p>
              </div>
            </div>
            <button onClick={() => { setView("perfil"); setTarefaAberta(null); }}
              className={"w-9 h-9 rounded-full " + corAvatar(user.nome) + " text-white flex items-center justify-center text-xs font-semibold hover:opacity-90 transition shrink-0"}
              aria-label="Abrir perfil">
              {iniciais(user.nome)}
            </button>
          </div>
        </header>

        <main key={view + (tarefaAtual ? tarefaAtual.id : "")}
          className="flex-1 px-4 py-5 pb-28 animate__animated animate__fadeIn animate__faster">
          {view === "inicio" && <Feed comunicados={comunicados} db={db} user={user} dados={{ comunicados, tarefas, eventos }} />}
          {view === "tarefas" && (tarefaAtual
            ? <DetalheTarefa user={user} tarefa={tarefaAtual} db={db} entregar={entregar} voltar={() => setTarefaAberta(null)} />
            : <ListaTarefas user={user} tarefas={tarefas} abrir={setTarefaAberta} />)}
          {view === "agenda" && <Agenda eventos={eventos} />}
          {view === "notas" && <Notas alunos={alunosVisiveis} aluno={alunoNotas} setAluno={setAlunoSelecionado} db={db} />}
          {view === "publicar" && user.tipo === "professor" && <Publicar publicar={publicar} />}
          {view === "perfil" && <Perfil user={user} sair={sair} resetar={resetar} db={db} />}
        </main>

        <nav className="fixed bottom-0 inset-x-0 mx-auto max-w-md bg-white border-t border-slate-200 flex justify-around py-1.5">
          {abas.map((aba) => {
            const ativo = view === aba[0];
            return (
              <button key={aba[0]}
                onClick={() => { setView(aba[0]); setTarefaAberta(null); }}
                className={"flex flex-col items-center gap-0.5 px-3 py-1.5 rounded-lg text-xs font-medium transition " +
                  (ativo ? "bg-marca-50 text-marca-700" : "text-slate-500 hover:text-slate-700 hover:bg-slate-100")}>
                <Icon name={aba[1]} className="w-5 h-5" />
                {titulos[aba[0]].split(" ")[0]}
              </button>
            );
          })}
        </nav>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
